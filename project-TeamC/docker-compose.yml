services:
  frontend:
    build:
      context: ./frontend
    container_name: learning-progress-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
  backend:
    build:
      context: ./backend
    container_name: learning-progress-backend
    ports:
      - "8000:8000"
    env_file:
      # .env が未配置でも /health の起動確認をしやすくするため任意にする。
      # /health/db は DATABASE_URL がない場合 503 を返す。
      - path: ./backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  db:
    image: postgres:18
    container_name: learning-progress-db
    ports:
      # ローカル開発用。PC側の5432番と競合しやすいため5433番を使用する。
      # 本番環境ではDBポートを外部公開しない想定。
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learning_progress_db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_progress_db"]
      # ローカル開発中に起動確認しやすいよう短めに設定する。
      # 本番環境ではインフラ要件に合わせて調整する。
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
